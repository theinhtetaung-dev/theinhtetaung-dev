<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-label="YaungMel POS animated project card">
  <style>
    .card{fill:#ffffff;stroke:#d0d7de}.title{fill:#1f2328}.muted{fill:#656d76}.desc{fill:#4b5563}.chip{fill:#f6f8fa;stroke:#d0d7de}.chipText{fill:#0969da}.glow{fill:#0969da}
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.title{font-size:22px;font-weight:700}.muted{font-family:'Cascadia Code',Consolas,monospace;font-size:12px}.desc{font-size:14px}.chipText{font-size:12px;font-weight:600}
    @media(prefers-color-scheme:dark){.card{fill:#161b22;stroke:#30363d}.title{fill:#e6edf3}.muted{fill:#8b949e}.desc{fill:#b1bac4}.chip{fill:#21262d;stroke:#30363d}.chipText{fill:#79c0ff}.glow{fill:#58a6ff}}
  </style>
  <defs>
    <clipPath id="cardClip"><rect x="5" y="5" width="490" height="210" rx="16"/></clipPath>
    <linearGradient id="accent" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect x="5" y="5" width="490" height="210" rx="16" class="card"/>
  <g clip-path="url(#cardClip)">
    <circle cx="-55" cy="115" r="68" class="glow" opacity="0.08" filter="url(#blur)">
      <animate attributeName="cx" values="-55;555;-55" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.04;0.13;0.04" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="18" y="5" width="464" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
  <circle cx="461" cy="37" r="5" fill="#3fb950">
    <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="48" class="title">YaungMel POS</text>
  <text x="30" y="72" class="muted">github.com/theinhtetaung-dev/YaungMel_POS</text>
  <text x="30" y="110" class="desc">Point-of-sale platform with a .NET Web API, database</text>
  <text x="30" y="133" class="desc">migrations, and Docker support.</text>
  <rect x="30" y="166" width="44" height="28" rx="8" class="chip"/><text x="52" y="185" text-anchor="middle" class="chipText">C#</text><rect x="84" y="166" width="104" height="28" rx="8" class="chip"/><text x="136" y="185" text-anchor="middle" class="chipText">TypeScript</text><rect x="198" y="166" width="72" height="28" rx="8" class="chip"/><text x="234" y="185" text-anchor="middle" class="chipText">Docker</text>
</svg>
