<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Thein Htet Aung developer profile summary">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="998" height="328" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="998" height="328" rx="22" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#card)">
    <circle cx="-80" cy="80" r="190" fill="url(#glow)">
      <animate attributeName="cx" values="-80;430;-80" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;250;80" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="300" r="170" fill="url(#glow)" opacity="0.7">
      <animate attributeName="cx" values="1030;680;1030" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;70;300" dur="17s" repeatCount="indefinite"/>
    </circle>
    <rect x="24" y="1" width="952" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <text x="42" y="48" font-family="'Cascadia Code',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#58a6ff">ABOUT / DEVELOPER PROFILE</text>
  <circle cx="948" cy="43" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;7;5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" font-weight="750" fill="#e6edf3">Building reliable backend experiences</text>
  <text x="42" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#9da7b3">Undergraduate at Myanmar Institute of Information Technology, turning software-engineering</text>
  <text x="42" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#9da7b3">concepts into practical, maintainable applications with a strong focus on the .NET ecosystem.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650">
    <rect x="42" y="174" width="168" height="34" rx="10" fill="#21262d" stroke="#30363d"/>
    <circle cx="60" cy="191" r="5" fill="#58a6ff"/><text x="73" y="196" fill="#e6edf3">MIIT Undergraduate</text>
    <rect x="222" y="174" width="142" height="34" rx="10" fill="#21262d" stroke="#30363d"/>
    <circle cx="240" cy="191" r="5" fill="#d2a8ff"/><text x="253" y="196" fill="#e6edf3">.NET Ecosystem</text>
    <rect x="376" y="174" width="168" height="34" rx="10" fill="#21262d" stroke="#30363d"/>
    <circle cx="394" cy="191" r="5" fill="#3fb950"/><text x="407" y="196" fill="#e6edf3">Backend Development</text>
  </g>

  <rect x="42" y="232" width="916" height="66" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="42" y="232" width="5" height="66" rx="2.5" fill="url(#accent)"/>
  <text x="68" y="257" font-family="'Cascadia Code',Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#58a6ff">CURRENT FOCUS</text>
  <text x="68" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#e6edf3">ASP.NET Core · Blazor · Entity Framework Core · Clean Architecture · Authentication · Database Design</text>
</svg>
